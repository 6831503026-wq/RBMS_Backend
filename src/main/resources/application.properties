spring.application.name=rbms
server.port=${PORT:5001}

# Load local settings when running from backend-boot; process environment still takes precedence.
spring.config.import=optional:file:.env[.properties]

# The Node implementation's db/schema.sql remains the database contract. Hibernate
# and automatic SQL initialization are intentionally disabled; no migrations run.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:restaurant_storage}?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never

# Configure JWT_SECRET in .env or the deployment environment. Empty is permitted at
# boot so the API can return the same explicit auth-configuration error as the source API.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=28800000

# Express cors() accepts any origin; do not enable cookie credentials.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.restaurant-time-zone=${RESTAURANT_TIME_ZONE:Asia/Bangkok}
app.po-email=${PO_EMAIL:__NOT_CONFIGURED__}
app.mail.from=${MAIL_FROM:${SMTP_USER:${GMAIL_USER:}}}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USER:${GMAIL_USER:}}
spring.mail.password=${SMTP_PASSWORD:${GMAIL_APP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SECURE:true}
spring.mail.properties.mail.smtp.starttls.enable=false

# Optional, explicit one-shot upsert of the two known demo identities.
app.seed.users.enabled=${SEED_USERS_ENABLED:false}
app.seed.users.manager.username=${USER_PO_LOGIN:demo_po}
app.seed.users.manager.password=${USER_PO_PASSWORD:}
app.seed.users.staff.username=${USER_STAFF_LOGIN:demo-kitchen}
app.seed.users.staff.password=${USER_STAFF_PASSWORD:}
